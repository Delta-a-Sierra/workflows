name: Reusable Container Build and Scan

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context relative to the repository root.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path relative to the repository root.
        required: false
        type: string
        default: Dockerfile
      image-tag:
        description: Image tag embedded in the exported image.
        required: false
        type: string
        default: ci-image:local
      upload-image:
        description: Upload the image after a successful build and scan.
        required: false
        type: boolean
        default: false
      image-artifact-name:
        description: Artifact name for the exported image archive.
        required: false
        type: string
        default: container-image
      scan-artifact-name:
        description: Artifact name for the Trivy JSON report.
        required: false
        type: string
        default: trivy-image-report
      severity:
        description: Comma-separated vulnerability severities that fail CI.
        required: false
        type: string
        default: HIGH,CRITICAL
    outputs:
      image-tag:
        description: Image tag used for the build.
        value: ${{ jobs.build-scan.outputs.image-tag }}
      image-artifact-name:
        description: Uploaded image artifact name, or empty if disabled.
        value: ${{ jobs.build-scan.outputs.image-artifact-name }}

permissions:
  contents: read

jobs:
  build-scan:
    name: Container Build and Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image-tag: ${{ inputs.image-tag }}
      image-artifact-name: >-
        ${{ steps.upload-image.outcome == 'success'
            && inputs.image-artifact-name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Build image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.image-tag }}
          pull: true
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Scan image archive
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNORE_UNFIXED: "false"
          TRIVY_PKG_TYPES: os,library
        with:
          version: v0.70.0
          cache: false
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          vuln-type: os,library
          severity: ${{ inputs.severity }}
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-results.json
          timeout: 5m

      - name: Upload scan report
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.scan-artifact-name }}
          path: ${{ runner.temp }}/trivy-results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload scanned image
        id: upload-image
        if: success() && inputs.upload-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.image-artifact-name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
